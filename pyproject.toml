[build-system]
requires = ["setuptools >= 42.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graphene_gae"
authors = [{ name = "Eran Kampf", email = "eran@ekampf.com" }]
description = "Graphene GAE Integration"
readme = "README.rst"
requires-python = ">=2.7"
keywords = ["graphene_gae"]
license = { text = "BSD-3-Clause" }
classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: BSD License',
    'Natural Language :: English',
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.4",
]
dependencies = [
    'appengine-python-standard>=1.0',
    'six>=1.10.0',
    'inflect==0.2.5',
    'graphene==3.4.*',
    'iso8601',
]
dynamic = ["version"]

[project.urls]
GitHub = 'https://github.com/graphql-python/graphene-gae'

[tool.setuptools.packages.find]
where = ["."]
exclude = ['tests*', 'examples*']
include = ["graphene_gae*"]

[tool.setuptools.dynamic]
version = { attr = "graphene_gae.__version__" }
